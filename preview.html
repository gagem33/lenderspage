<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('lh-payload').textContent);
  var KEY_NAME = 'lenderhub.pkey.' + P.salt.slice(0, 12); // changes whenever the site is re-encrypted
  var form = document.getElementById('lh-gate'), pw = document.getElementById('lh-pw'),
      rm = document.getElementById('lh-rm'), go = document.getElementById('lh-go'), err = document.getElementById('lh-err');
  var b64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var toB64 = function (u) { var s = ''; u = new Uint8Array(u); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  function store(kind) { try { return window[kind]; } catch (e) { return null; } }
  function forget() {
    ['localStorage', 'sessionStorage'].forEach(function (k) {
      var s = store(k); if (!s) return;
      for (var i = s.length - 1; i >= 0; i--) { var n = s.key(i); if (n && n.indexOf('lenderhub.pkey.') === 0) s.removeItem(n); }
    });
  }
  async function derive(password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter }, base, 256));
  }
  async function open(raw) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    var stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  function show(html) {
    document.open(); document.write(html); document.close();
  }
  if (/[?#&]lock\b/.test(location.search + location.hash)) { forget(); history.replaceState(null, '', location.pathname); }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    form.hidden = false; go.disabled = true;
    err.textContent = 'This browser is too old to open LenderHub. Update iOS/Chrome and try again.';
    return;
  }
  (async function auto() {
    var saved = (store('localStorage') && localStorage.getItem(KEY_NAME)) || (store('sessionStorage') && sessionStorage.getItem(KEY_NAME));
    if (saved) {
      try { show(await open(b64(saved))); return; } catch (e) { forget(); }
    }
    form.hidden = false; pw.focus();
  })();
  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    err.textContent = ''; go.disabled = true; go.textContent = 'Unlocking\u2026';
    try {
      var raw = await derive(pw.value.trim());
      var html = await open(raw);
      forget();
      var s = store(rm.checked ? 'localStorage' : 'sessionStorage');
      if (s) try { s.setItem(KEY_NAME, toB64(raw)); } catch (e) {}
      show(html);
    } catch (e) {
      go.disabled = false; go.textContent = 'Unlock';
      err.textContent = 'Wrong password.'; pw.select();
    }
  });
})();
</script>
